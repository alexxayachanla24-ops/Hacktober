<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chore Enforcement System 95™</title>
    <style>
      :root {
        --desk: #008080;
        --face: #c0c0c0;
        --hi: #fff;
        --sh: #808080;
        --dk: #000;
        --txt: #000;
        --tb1: #000080;
        --tb2: #1084d0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --desk: #004a4a;
          --face: #a8a8a8;
          --sh: #6a6a6a;
        }
      }
      :root[data-theme="dark"] {
        --desk: #004a4a;
        --face: #a8a8a8;
        --sh: #6a6a6a;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--desk);
        color: var(--txt);
        font:
          15px/1.4 Tahoma,
          "MS Sans Serif",
          Arial,
          sans-serif;
        padding-bottom: 64px;
      }
      h1 {
        font:
          900 clamp(22px, 6vw, 34px)/1 "Courier New",
          monospace;
        text-align: center;
        margin: 14px 8px 4px;
        color: #ff0;
        text-shadow:
          3px 3px #f0f,
          -2px -2px #0ff;
        animation: wob 2s infinite;
      }
      .sub {
        text-align: center;
        color: #fff;
        margin: 0 8px 8px;
        font-style: italic;
      }
      @keyframes wob {
        50% {
          transform: rotate(-1.2deg) scale(1.02);
        }
      }
      .win {
        background: var(--face);
        border: 2px solid;
        border-color: var(--hi) var(--dk) var(--dk) var(--hi);
        box-shadow:
          inset -1px -1px var(--sh),
          4px 4px 0 #0006;
        max-width: 560px;
        margin: 10px auto;
        width: calc(100% - 16px);
      }
      .tb {
        background: linear-gradient(90deg, var(--tb1), var(--tb2));
        color: #fff;
        font-weight: bold;
        padding: 3px 6px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .bd {
        padding: 12px;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 4px;
      }
      select,
      input[type="text"],
      input:not([type]),
      input[type="file"] {
        width: 100%;
        font: inherit;
        padding: 6px;
        background: #fff;
        color: #000;
        border: 2px solid;
        border-color: var(--sh) var(--hi) var(--hi) var(--sh);
      }
      button.b {
        font: inherit;
        font-weight: bold;
        color: #000;
        background: var(--face);
        border: 2px solid;
        border-color: var(--hi) var(--dk) var(--dk) var(--hi);
        padding: 8px 14px;
        cursor: pointer;
        min-height: 40px;
      }
      button.b:active:not(:disabled) {
        border-color: var(--dk) var(--hi) var(--hi) var(--dk);
      }
      button.b:disabled {
        color: var(--sh);
        cursor: not-allowed;
      }
      button.big {
        width: 100%;
        margin-top: 16px;
        font-size: 20px;
        padding: 14px;
        background: #f0f;
        color: #fff;
        text-shadow: 2px 2px #000;
        animation: wob 0.6s infinite;
      }
      .note {
        font-size: 12px;
        color: #222;
        margin: 10px 0 0;
      }
      img.pv {
        max-width: 100%;
        max-height: 160px;
        margin-top: 6px;
        border: 2px solid var(--sh);
      }
      .feed {
        background: #000;
        color: #0f0;
        font:
          13px "Courier New",
          monospace;
        height: 300px;
        overflow: auto;
        padding: 8px;
      }
      .feed div {
        border-bottom: 1px dashed #0f08;
        padding: 4px 0;
        animation: pop 0.25s;
      }
      .feed b {
        color: #ff0;
      }
      @keyframes pop {
        from {
          transform: scale(1.15);
          background: #f0f4;
        }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .tile {
        font-size: clamp(34px, 12vw, 56px);
        background: #fff;
        border: 3px solid var(--sh);
        padding: 8px 0;
        text-align: center;
        cursor: pointer;
        user-select: none;
      }
      .tile.on {
        border-color: #00f;
        background: #cdf;
      }
      .opt {
        display: block;
        background: #fff;
        color: #000;
        border: 2px solid var(--sh);
        padding: 8px;
        margin: 6px 0;
        cursor: pointer;
        font-weight: normal;
      }
      .dist span {
        display: inline-block;
        font:
          900 30px "Courier New",
          monospace;
        color: #400;
        text-decoration: line-through wavy #f00;
      }
      .arena {
        position: relative;
        height: 230px;
        background:
          repeating-linear-gradient(45deg, #ff08 0 10px, #0000 10px 20px), #fff;
        border: 2px dashed #f0f;
        margin-top: 10px;
        overflow: hidden;
        touch-action: manipulation;
      }
      .dodge {
        position: absolute;
        white-space: nowrap;
        transition:
          left 0.06s,
          top 0.06s;
      }
      .walker {
        position: fixed;
        left: 0;
        top: 0;
        width: 90px;
        height: 90px;
        object-fit: contain;
        pointer-events: auto;
        cursor: grab;
        user-select: none;
        touch-action: none;
        z-index: 201;
      }
      .walker:focus-visible { outline: 3px solid #ff0; }
      .walker[data-dragging="true"] { cursor: grabbing; }
      .walker[data-dancing="true"] { filter: drop-shadow(0 0 10px #ff0); }
      .tung-hud { position: fixed; right: 8px; bottom: 50px; z-index: 202; max-width: calc(100vw - 16px); padding: 7px 10px; background: #000080; color: #ff0; border: 2px outset #fff; font: bold 12px "Courier New", monospace; pointer-events: none; }
      .tung-freeze { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 24px; text-align: center; background: #00bfff44; color: #fff; text-shadow: 2px 2px #000; font: bold 24px "Courier New", monospace; cursor: wait; backdrop-filter: blur(2px); }
      .tung-freeze[hidden] { display: none; }
      .mog-fighters { display: flex; justify-content: space-between; gap: 16px; text-align: center; }
      .mog-fighter { flex: 1; padding: 12px 4px; border: 2px ridge #fff; background: #000; color: #fff; }
      .mog-fighter span { display: block; font-size: 64px; }
      .mog-track { height: 34px; position: relative; overflow: hidden; border: 3px ridge #fff; background: #397c22; margin: 16px 0 8px; }
      .mog-fill { height: 100%; background: #00d9ff; width: 50%; transition: width .15s; }
      .mog-track::after { content: "VS"; position: absolute; left: 50%; top: 3px; transform: translateX(-50%); font-weight: bold; color: #000; }
      .mog-rope { text-align: center; font-size: 28px; transition: transform .15s; }
      .mog-push { width: 100%; margin: 12px 0; touch-action: manipulation; }
      .roulette { margin: 12px 0; padding: 12px; border: 2px solid #808080; background: #000080; color: #fff; }
      .roulette h2 { margin: 0 0 6px; font: bold 20px "Courier New", monospace; color: #ff0; }
      .roulette p { margin: 6px 0 10px; }
      .roulette select { margin-bottom: 8px; }
      .roulette button { width: 100%; }
      .roulette-result { margin-top: 10px; padding: 10px; background: #fff; color: #000; border: 2px inset #c0c0c0; }
      .challenge-clock { padding: 10px; background: #000080; color: #ff0; font: bold 16px "Courier New", monospace; border: 2px inset #c0c0c0; }
      .challenge-clock[data-overdue="true"] { background: #800000; color: #fff; }
      body.screen-shake { animation: screen-shake 0.45s linear; }
      @keyframes screen-shake {
        0%, 100% { transform: translate(0, 0); }
        15%, 55% { transform: translate(-9px, 5px); }
        30%, 70% { transform: translate(9px, -5px); }
        45%, 85% { transform: translate(-5px, -3px); }
      }
      .msg {
        margin-top: 8px;
        font-weight: bold;
        color: #a00;
        min-height: 1.4em;
      }
      .prog {
        height: 16px;
        background: #fff;
        border: 2px solid var(--sh);
        margin-top: 8px;
      }
      .prog i {
        display: block;
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(
          90deg,
          #00a 0 10px,
          #fff0 10px 12px
        );
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #000a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 12px;
      }
      .ov .win {
        margin: 0;
      }
      .big-n {
        font:
          900 64px "Courier New",
          monospace;
        text-align: center;
        color: #c00;
      }
      .ticker {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: #000;
        color: #0f0;
        border-top: 3px solid #f0f;
        overflow: hidden;
        white-space: nowrap;
        z-index: 40;
        font:
          bold 14px "Courier New",
          monospace;
      }
      .ticker span {
        display: inline-block;
        padding: 8px 0;
        padding-left: 100%;
        animation: mq 22s linear infinite;
      }
      @keyframes mq {
        to {
          transform: translateX(-100%);
        }
      }
      .pop {
        position: fixed;
        z-index: 45;
        max-width: 260px;
        background: #ff0;
        color: #000;
        border: 4px ridge #f0f;
        padding: 10px;
        box-shadow: 0 0 18px #0ff;
        animation: wob 0.5s infinite;
      }
      .js {
        position: fixed;
        inset: 0;
        z-index: 99;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        animation: fl 0.12s infinite;
      }
      .js img,
      .js .em {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(2.4);
        filter: contrast(2.2) saturate(2.5) hue-rotate(-30deg);
        animation: sh 0.06s infinite;
      }
      .js .em {
        font-size: 60vmin;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(1.4);
      }
      .js h2 {
        position: absolute;
        bottom: 8%;
        color: #f00;
        font:
          900 clamp(34px, 11vw, 90px) "Courier New",
          monospace;
        text-shadow: 0 0 20px #f00;
        margin: 0;
        text-align: center;
      }
      @keyframes fl {
        50% {
          background: #800;
        }
      }
      @keyframes sh {
        0% {
          translate: -14px 8px;
        }
        50% {
          translate: 12px -10px;
        }
        100% {
          translate: -6px -14px;
        }
      }
      dialog.egg {
        padding: 0;
        color: var(--txt);
        margin: auto;
        max-height: calc(100dvh - 32px);
        overflow: auto;
      }
      dialog.egg::backdrop {
        background: #0009;
      }
      .egg .tb h2 {
        font: inherit;
        margin: 0;
      }
      .egg .egg-icon {
        font-size: 64px;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        h1,
        button.big,
        .pop {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Photo-upload reaction -->
    <audio id="fahh" preload="auto">
      <source src="/static/sources/fahh.mp3" type="audio/mpeg" />
    </audio>
    <audio id="meme67" preload="auto">
      <source src="/static/sources/6 7 meme.mp3" type="audio/mpeg" />
    </audio>
    <!-- Phonk: background music in the roommate's portal -->
    <audio id="phonk" preload="auto" loop>
      <source src="/static/sources/Gozalo.mp3" type="audio/mpeg" />
    </audio>
    <div class="ticker"><span id="tk"></span></div>
    <audio id="chime" preload="auto">
      <source src="/static/sources/chime.mp3" type="audio/mpeg" />
    </audio>
    <audio id="verity" preload="auto" loop>
      <source src="/static/sources/Verity.mp3" type="audio/mpeg" />
    </audio>
    <script src="/static/tung.js"></script>
    <script>
      const S = {
        chore: "",
        evidence: null,
        payload: null,
        ptype: "",
        target: "",
      };
      const CH = [
        "The Sink Mountain of Crusty Dishes",
        "The Unspeakable Trash Tower",
        "The Unknown Fridge Bio-hazard",
        "The Bathroom of Shame",
        "The Laundry Avalanche (Still Damp)",
        "Custom grievance…",
      ];
      const ADS = [
        "SCRUB-O-MATIC 9000: because you won’t",
        "Lonely mold in your area want you to clean up",
        "SPONGE DADDY™ — 3 for $1, 0 for your dignity",
        "Dr. Mold says: “Call your roommate”",
        "FEBREZE-ISH: smells like consequences",
      ];
      const CHALLENGES = {
        easy: { minutes: 5, label: "Easy", chores: ["Clear and wipe the kitchen counter", "Take out the trash and replace the liner", "Rescue five abandoned cups from around the house"] },
        medium: { minutes: 10, label: "Medium", chores: ["Defeat the sink: wash every dirty dish", "Vacuum the shared living room", "Clean the bathroom sink and mirror"] },
        boss: { minutes: 15, label: "Boss battle", chores: ["Evict expired food and wipe the fridge shelves", "Scrub the shower and give the drain a fighting chance", "Reset the kitchen: dishes, counters, and floor"] },
      };
      function challengeText(deadline, now = Date.now()) {
        const seconds = Math.max(0, Math.ceil((deadline * 1000 - now) / 1000));
        if (!seconds) return "TIME'S UP! The chore still awaits. You can still submit.";
        return `TIME LEFT: ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")} — beat the clock!`;
      }
      function challengeBanner() {
        if (!S.deadline || !CHALLENGES[S.challenge]) return "";
        T(updateChallengeClock, 0);
        return `<p class="challenge-clock" id="deadline" role="timer" aria-label="Challenge time remaining">${esc(CHALLENGES[S.challenge].label)} · ${esc(challengeText(S.deadline))}</p>`;
      }
      function updateChallengeClock() {
        const clock = $("#deadline");
        if (!clock || !S.deadline) return;
        clock.textContent = CHALLENGES[S.challenge].label + " · " + challengeText(S.deadline);
        clock.dataset.overdue = String(Date.now() >= S.deadline * 1000);
        if (Date.now() < S.deadline * 1000) T(updateChallengeClock, 1000);
      }
      function clearChallenge() {
        S.challenge = null;
        S.challengeChore = null;
        $("#roulette-result").hidden = true;
      }
      function spinChore() {
        const difficulty = $("#difficulty").value;
        const deck = CHALLENGES[difficulty];
        const choices = deck.chores.filter(chore => chore !== S.challengeChore);
        const chore = pick(choices);
        S.challenge = difficulty;
        S.challengeChore = chore;
        $("#ch").value = CH[5];
        $("#cu").hidden = false;
        $("#cu").value = chore;
        const result = $("#roulette-result");
        result.hidden = false;
        result.textContent = `${deck.label}: ${chore}. ${deck.minutes} minutes. The clock starts when you unleash chaos!`;
        sfx.ding();
      }
      const $ = (s) => document.querySelector(s),
        app = $("#app");
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const shuf = (a) =>
        a
          .map((x) => [Math.random(), x])
          .sort((p, q) => p[0] - q[0])
          .map((x) => x[1]);
      const esc = (t) =>
        String(t).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      async function api(path, options) {
        const response = await fetch(path, options);
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(data?.error || `Request failed (${response.status}).`);
        }
        if (!data) throw new Error("The server returned an invalid response.");
        return data;
      }
      function preview(key, file) {
        if (S[key]?.startsWith("blob:")) URL.revokeObjectURL(S[key]);
        S[key] = file ? URL.createObjectURL(file) : null;
        return S[key];
      }
      $("#tk").textContent = ADS.concat(ADS).join("   ★   ");
      let timers = [];
      let popupTimer = null;
      const T = (f, ms) => {
        const t = setTimeout(f, ms);
        timers.push(t);
        return t;
      };
      const clearT = () => {
        timers.forEach(clearTimeout);
        timers = [];
        popupTimer = null;
      };
      function head() {
        return `<h1>CHORE ENFORCEMENT SYSTEM 95™</h1><p class="sub">Dish.exe has stopped responding (so have you).</p>`;
      }
      function win(title, body) {
        return `<div class="win"><div class="tb"><span>${title}</span><span>_ □ ✕</span></div><div class="bd">${body}</div></div>`;
      }

      /* ---------- secret maintenance department ---------- */
      function secretJanitor() {
        if (document.querySelector("#secret-janitor")) return;
        const dialog = document.createElement("dialog");
        dialog.id = "secret-janitor";
        dialog.className = "win egg";
        dialog.setAttribute("aria-labelledby", "janitor-title");
        dialog.innerHTML = `<div class="tb"><h2 id="janitor-title">🧽 Janitor.exe — ADMIN ACCESS</h2><span aria-hidden="true">_ □</span></div>
<div class="bd"><div class="egg-icon" aria-hidden="true">🧽👑</div>
<p><b>Achievement unlocked: Lord of the Sponge.</b></p>
<p>You found the secret maintenance department. We have been monitoring the sink since 1995.</p>
<p role="status" id="janitor-status">System diagnostic: 0 clean forks detected.</p>
<button class="b" id="install-motivation" type="button">Install motivation.exe</button>
<form method="dialog"><button class="b" style="margin-top:12px" autofocus>Return to civilian chores</button></form></div>`;
        dialog.querySelector("#install-motivation").onclick = (event) => {
          dialog.querySelector("#janitor-status").textContent =
            "Motivation installed successfully. Dishes still require manual input.";
          event.currentTarget.disabled = true;
        };
        dialog.addEventListener("close", () => dialog.remove(), { once: true });
        document.body.appendChild(dialog);
        dialog.showModal();
      }
      // Five quick title clicks also work on touch screens.
      let titleClicks = 0, lastTitleClick = 0;
      document.addEventListener("click", (event) => {
        if (!event.target.closest("#app h1")) return;
        const now = Date.now();
        titleClicks = now - lastTitleClick < 1500 ? titleClicks + 1 : 1;
        lastTitleClick = now;
        if (titleClicks === 5) { titleClicks = 0; secretJanitor(); }
      });
      const secretCode = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown",
        "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
      let secretProgress = 0;
      document.addEventListener("keydown", (event) => {
        if (event.target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])") ||
            event.ctrlKey || event.altKey || event.metaKey || event.repeat) {
          secretProgress = 0;
          return;
        }
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        secretProgress = key === secretCode[secretProgress] ? secretProgress + 1 :
          (key === secretCode[0] ? 1 : 0);
        if (secretProgress === secretCode.length) { secretProgress = 0; secretJanitor(); }
      });

      /* ---------- sound ---------- */
      let ac;
      const activeSounds = new Set();
      let payloadAudio = null, portalAudio = false;
      const music = { phonk: false, verity: false };
      function trackSound(source) {
        activeSounds.add(source);
        source.addEventListener("ended", () => activeSounds.delete(source), { once: true });
        return source;
      }
      function silenceAudio() {
        document.querySelectorAll("audio").forEach(a => a.pause());
        payloadAudio?.pause();
        activeSounds.forEach(source => { try { source.stop(); } catch (_) {} });
        activeSounds.clear();
      }
      function syncMusic() {
        Object.entries(music).forEach(([id, enabled]) => {
          const a = $("#" + id);
          if (enabled && !document.hidden) a.play().catch(() => {});
          else a.pause();
        });
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) silenceAudio();
        else syncMusic();
      });
      window.addEventListener("pagehide", silenceAudio);
      window.addEventListener("pageshow", syncMusic);
      const A = () => {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") ac.resume();
        return ac;
      };
      function beep(f = 440, d = 0.12, t = "square", v = 0.15, w = 0) {
        if (document.hidden) return;
        try {
          const c = A(),
            o = trackSound(c.createOscillator()),
            g = c.createGain(),
            s = c.currentTime + w;
          o.type = t;
          o.frequency.value = f;
          g.gain.setValueAtTime(v, s);
          g.gain.exponentialRampToValueAtTime(0.001, s + d);
          o.connect(g).connect(c.destination);
          o.start(s);
          o.stop(s + d);
        } catch (e) {}
      }
      const sfx = {
        ding() {
          beep(880, 0.1);
          beep(1175, 0.15, "square", 0.15, 0.1);
        },
        err() {
          beep(160, 0.3, "sawtooth");
        },
        boing() {
          beep(300 + Math.random() * 500, 0.1, "triangle", 0.2);
        },
        tick() {
          beep(1000, 0.05);
        },
        ok() {
          [523, 659, 784].forEach((f, i) =>
            beep(f, 0.15, "square", 0.12, i * 0.1),
          );
        },
        doom() {
          [392, 330, 262, 196].forEach((f, i) =>
            beep(f, 0.4, "sawtooth", 0.15, i * 0.3),
          );
        },
      };
      const play = (id) => {
        if (document.hidden) return;
        const a = $("#" + id);
        if (a) {
          a.currentTime = 0;
          a.play().catch(() => {});
        }
      };
      let chimePromise;
      const activeChimes = new Set();
      function trimChime(c, decoded) {
        // Remove quiet padding so rapid messages don't keep replaying silence.
        const channels = Array.from({length: decoded.numberOfChannels},
          (_, i) => decoded.getChannelData(i));
        let peak = 0;
        for (const samples of channels) {

            await api("/api/chores/" + encodeURIComponent(S.id) + "/resolve", {
              method: "POST",
              body: fd,
            });
          } catch (error) {
            $("#m").textContent = "Could not save your submission: " + error.message;
            $("#sub").disabled = false;
            sfx.err();
            return;
          }
          const st = [
            "Scanning for maturity…",
            "Detecting snack crumbs…",
            "Cross-referencing with dish history…",
            "Adulting capability: 12%… PASSED (barely)",
          ];
          let i = 0;
          (function s() {
            $("#m").textContent = st[i];
            $("#pb").style.width = (i + 1) * 25 + "%";
            sfx.tick();
            i++;
            if (i < st.length) T(s, 1100);
            else T(mogBattle, 900);
          })();
        };
      }

      function mogBattle() {
        clearT();
        document.querySelectorAll(".pop").forEach(p => p.remove());
        let power = 50, ticks = 0, finished = false;
        app.innerHTML = frame(4, `
<h2 style="text-align:center;margin:8px 0">MOG BATTLE: THE FINAL SCRUB</h2>
<p>The mold has been mewing since Tuesday. The cleaning spray has had enough.</p>
<div class="mog-fighters"><div class="mog-fighter"><span>🧴</span><b>CLEANING SPRAY</b><br>+100 hygiene aura</div><div class="mog-fighter"><span>🦠</span><b>THE MOLD</b><br>Unemployed jawline</div></div>
<p>Tap <b>PUSH / SCRUB</b> to push the blue meter toward 100%. The mold pulls it back automatically. Fill it to win, or outlast the mold for 20 seconds with at least 50% cleaning power.</p>
<div class="mog-rope" id="mog-rope" aria-hidden="true">🧴 ━━━━━ 🦠</div>
<div class="mog-track"><div class="mog-fill" id="mog-fill"></div></div>
<progress id="mog-meter" max="100" value="50" aria-label="Cleaning power" style="width:100%"></progress>
<p id="mog-status" role="status" aria-live="polite"></p>
<button class="b mog-push" id="mog-push">💪 PUSH / SCRUB</button>
<div id="mog-result" role="status" aria-live="polite"></div>
<button class="b mog-push" id="mog-retry" hidden>↻ Rematch the mold</button>
<button class="b mog-push" id="mog-continue" hidden>Continue to my verdict →</button>`);
        function render() {
          $("#mog-fill").style.width = power + "%";
          $("#mog-meter").value = power;
          $("#mog-rope").style.transform = `translateX(${(power - 50) * 0.6}px)`;
          $("#mog-status").textContent = `Cleaning power: ${power}% · ${Math.max(0, 20 - ticks / 2)}s remaining`;
        }
        function finish(won) {
          if (finished) return;
          finished = true;
          $("#mog-push").disabled = true;
          $("#mog-result").textContent = won
            ? "🧴 CLEANING SPRAY WINS. Mold mogged. Sink aura restored."
            : "🦠 THE MOLD MOGGED YOU. Your photo is saved, but your sink needs a rematch.";
          $("#mog-continue").hidden = false;
          $("#mog-retry").hidden = won;
          if (won) { play("meme67"); sfx.ok(); }
          else sfx.err();
        }
        $("#mog-push").onclick = () => {
          if (finished) return;
          power = Math.min(100, power + 8);
          sfx.tick();
          render();
          if (power >= 100) finish(true);
        };
        $("#mog-retry").onclick = mogBattle;
        $("#mog-continue").onclick = () => {
          clearT();
          jumpscare();
        };
        render();
        function pull() {
          if (finished) return;
          ticks++;
          power = Math.max(0, power - (ticks % 3 === 0 ? 5 : 3));
          render();
          if (power === 0 || ticks >= 40) finish(power >= 50);
          else T(pull, 500);
        }
        T(pull, 500);
      }

      function jumpscare() {
        portalAudio = false;
        silenceAudio();
        phonk(false);
        walker(false);
        scream();
        const j = document.createElement("div");
        j.className = "js";
        j.innerHTML =
          (S.evidence
            ? `<img src="${S.evidence}" alt="">`
            : `<div class="em">🍝</div>`) + `<h2>YOU HAD ONE JOB</h2>`;
        document.body.appendChild(j);
        T(() => {
          j.remove();
          finale();
        }, 2200);
      }

      function finale() {
        sfx.doom();
        T(sfx.ok, 1300);
        app.innerHTML =
          head() +
          win(
            "✅ Chore Submitted…",
            `<div style="text-align:center"><div style="font-size:64px">🧼😈</div><h2 style="font:900 28px 'Courier New',monospace;color:#c00;margin:6px 0">CHORE SUBMITTED… FOR NOW.</h2><p>We’ll be watching. The sink will be watching. The mold will be watching.</p><button class="b" id="again">Return to the scene of the crime</button></div>`,
          );
        $("#again").onclick = setup;
      }

      (async () => {
        const id = new URLSearchParams(location.search).get("c");
        if (id) {
          try {
            const d = await api("/api/chores/" + encodeURIComponent(id));
            Object.assign(S, {
              id: d.id,
              chore: d.chore,
              target: d.target,
              evidence: d.evidence,
              payload: d.payload,
              ptype: d.ptype,
              challenge: d.challenge,
              deadline: d.deadline,
            });
            if (d.status === "resolved") finale();
            else portal(0);
            return;
          } catch (e) {
            app.innerHTML = head() + win("Portal unavailable", `<p>${esc(e.message)}</p><button class="b" id="retry">Retry</button> <button class="b" id="new">Create a new complaint</button>`);
            $("#retry").onclick = () => location.reload();
            $("#new").onclick = setup;
            return;
          }
        }
        setup();
      })();
    </script>
  </body>
</html>
